# Copy this file to server.ini. Run serve from an elevated terminal.
ServerName=Vhui USB Server
NetworkInterface=127.0.0.1
TCPPort=7575
AllowedClients=127.0.0.1,::1
AllowedDevices=145f/02e7
IgnoredDevices=
UseAVAHI=0
PingInterval=4
PingTimeout=9
ScanInterval=2
TraceMsgs=0
HideClientInfo=0
RemoteAdmin=0

# LAN example: change NetworkInterface to 0.0.0.0, set AllowedClients to your
# subnet (for example 192.168.1.0/24), and enable UseAVAHI=1 if wanted.

# SSLCert selects TLS-only mode. PEM with key or PFX are supported.
# Relative paths resolve from this configuration file's directory.
# SSLCert=certs/server.pem
# SSLKeyFile=certs/server.key
# SSLPort=7574
# SSLUseClientCerts=1
# SSLCAFile=certs/ca.pem

# Without SSLCert use ReverseClients (default client port 7573).
# With SSLCert use SSLReverseClients (default client port 7572).
# ReverseClients=192.168.1.20
# SSLReverseClients=192.168.1.20
# ReverseClientsRetryPeriod=15

# Native authorization exit codes: 0=deny, 1=allow, 2/3 return -7/-8.
# Prefer VH_* environment variables in the hook program for remote values.
# ClientAuthorization=C:\scripts\authorize.exe
# ClientDeauthorization=C:\scripts\released.exe
# HookTimeout=30
# onReset.145f.02e7=
